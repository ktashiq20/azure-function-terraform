name: 'FunctionApp'

on:
  # push:
  #   branches: [ "test" ]
  #   paths:
  #     - '.github/workflows/FunctionApp.yml'
  workflow_dispatch:
    inputs:
      INTEGRATION_NAME:
        description: 'Enter Integration Name(FunctionApp)'
        required: true
        type: string
        default: 'TestIntegration'
      REGION:
        description: 'Enter region(uks and aue)'
        required: true
        type: choice
        default: 'uks'
        options: [uks, aue]
      ENVIRONMENT:
        description: 'Enter Environment(dev,qa,uat and prd)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, qa, uat, prd]
      FUNAPP_CHOICE:
        description: 'Choose function app GIP Service (or) Integration Project'
        type: choice
        required: true
        default: 'FunApp_IntgrProject'
        options: [FunApp_GipService, FunApp_IntgrProject, FunApp_PluginService, WebApp_GipService]

  workflow_call:
    inputs:
      INTEGRATION_NAME:
        required: true
        type: string
      REGION:
        required: true
        type: string
      ENVIRONMENT:
        required: true
        type: string
      FUNAPP_CHOICE:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
      AZURE_CREDENTIALS_PRD:
        required: true
      GIP_GITHUB_TOKEN:
        required: false

# env:
#   INTEGRATION_NAME: 'testIntegration'
#   ENVIRONMENT: 'dev'
#   REGION: 'uks'
jobs:
  azure-FA:
    name: 'azure-FA'
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ./Automation/Terraform-Iac/GipIntegrationProjectAdapters/FunctionApps/${{inputs.FUNAPP_CHOICE}}

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: 'Checkout terraform script'
      uses: actions/checkout@v4

    - name: Azure Login (${{ inputs.REGION }}-${{ inputs.ENVIRONMENT }})
      uses: azure/login@v2
      with:
        creds: ${{ contains('prd', inputs.ENVIRONMENT) && secrets.AZURE_CREDENTIALS_PRD || secrets.AZURE_CREDENTIALS }}

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Extract variables from environments/${{ inputs.REGION }}/${{ inputs.ENVIRONMENT }}.tfvars
      id: extract-vars
      run: |
        if [ "${{ inputs.ENVIRONMENT }}" = "prd" ]; then
          echo "RESOURCE_GROUP_NAME=$(grep 'RESOURCE_GROUP_NAME_STATE_FILE' environments/${{ inputs.REGION }}/${{ inputs.ENVIRONMENT }}.tfvars | cut -d'=' -f2 | xargs)" >> $GITHUB_ENV
        else
          echo "RESOURCE_GROUP_NAME=$(grep 'RESOURCE_GROUP_NAME' environments/${{ inputs.REGION }}/${{ inputs.ENVIRONMENT }}.tfvars | cut -d'=' -f2 | xargs)" >> $GITHUB_ENV
        fi
        echo "STATE_FILE_SA_NAME=$(grep 'STATE_FILE_SA_NAME' environments/${{ inputs.REGION }}/${{ inputs.ENVIRONMENT }}.tfvars | cut -d'=' -f2 | xargs)" >> $GITHUB_ENV

    - name: Get Storage Account Access Key
      id: get-storage-key
      run: |
        key=$(az storage account keys list \
          --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
          --account-name ${{ env.STATE_FILE_SA_NAME }} \
          --query "[0].value" -o tsv)
        echo "STORAGE_KEY=$key" >> $GITHUB_ENV

    - name: Check and Create Blob Container
      id: create-blob-container
      run: |
        # Define container name and convert to lowercase
        container_name=$(echo "functionapp-tfstateblob" | tr '[:upper:]' '[:lower:]')
        # Check if the container exists
        if ! az storage container exists --name $container_name --account-name ${{ env.STATE_FILE_SA_NAME }} --account-key ${{ env.STORAGE_KEY }} --query "exists" -o tsv | grep -q true; then
          # Create the container if it doesn't exist
          az storage container create --name $container_name --account-name ${{ env.STATE_FILE_SA_NAME }} --account-key ${{ env.STORAGE_KEY }}
          echo "Created container $container_name"
        else
          echo "Container $container_name already exists"
        fi
        echo "CONTAINER_NAME=$container_name" >> $GITHUB_ENV

    - name: Terraform Init
      env:
        AZURE_STORAGE_ACCOUNT_NAME: ${{ env.STATE_FILE_SA_NAME }}
        AZURE_STORAGE_CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        AZURE_STORAGE_ACCESS_KEY: ${{ env.STORAGE_KEY }}
        AZURE_STORAGE_KEY: ${{ inputs.FUNAPP_CHOICE == 'WebApp_GipService' && format('WebApp-{0}-{1}-uks-terraform.tfstate', inputs.INTEGRATION_NAME, inputs.ENVIRONMENT) || format('func-{0}-{1}-uks-terraform.tfstate', inputs.INTEGRATION_NAME, inputs.ENVIRONMENT) }}
      run: terraform init -backend-config="storage_account_name=${AZURE_STORAGE_ACCOUNT_NAME}" -backend-config="container_name=${AZURE_STORAGE_CONTAINER_NAME}" -backend-config="access_key=${AZURE_STORAGE_ACCESS_KEY}" -backend-config="key=${AZURE_STORAGE_KEY}"

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      env:
        TF_VAR_INTEGRATION_NAME: ${{ inputs.INTEGRATION_NAME }}
        TF_VAR_GITHUB_PAT_TOKEN: ${{ secrets.GIP_GITHUB_TOKEN }}
        TF_VAR_GITHUB_BRANCH_NAME: ${{ github.ref_name }}
      run: terraform plan -input=false -var-file=./environments/${{ inputs.REGION }}/${{ inputs.ENVIRONMENT }}.tfvars

    - name: Terraform Apply
      env:
        TF_VAR_INTEGRATION_NAME: ${{ inputs.INTEGRATION_NAME }}
        TF_VAR_GITHUB_PAT_TOKEN: ${{ secrets.GIP_GITHUB_TOKEN }}
        TF_VAR_GITHUB_BRANCH_NAME: ${{ github.ref_name }}
      run: terraform apply -auto-approve -input=false -var-file=./environments/${{ inputs.REGION }}/${{ inputs.ENVIRONMENT }}.tfvars
      #if: github.ref == 'refs/heads/"master"' && github.event_name == 'push'
